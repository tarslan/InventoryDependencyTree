# Bandit Configuration for ML Security Scanner
# Static security analysis for Python code

# Excluded paths/patterns (relative to project root)
exclude_dirs:
  - .venv
  - venv
  - tests
  - artifacts

# Skipped tests (high false-positive rate tests)
